name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.15
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Install dependencies from uv.lock
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v
