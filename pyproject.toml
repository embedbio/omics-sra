[project]
name = "omics-sra"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "boto3>=1.43.123",
    "pandera[polars]>=0.35.0",
    "polars>=2.0,<3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "moto[s3]>=5.2.5",
    "pytest>=9.2.0",
]
lambda = [
    "awslambdaric==4.2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
